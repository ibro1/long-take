name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install
        shell: bash

      - name: 🔧 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📖 Read version from app.json
        id: version
        run: |
          VERSION=$(cat app.json | grep '"version"' | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: 🏗️ Build Android APK via EAS
        run: |
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive \
            --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: eas-build-android
          path: ./artifacts

      - name: 📦 Prepare release assets
        run: |
          ls -la ./artifacts/
          APK_PATH=$(find ./artifacts -name "*.apk" | head -1)
          AAB_PATH=$(find ./artifacts -name "*.aab" | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "AAB_PATH=$AAB_PATH" >> $GITHUB_OUTPUT
        id: artifacts

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: ${{ steps.artifacts.outputs.APK_PATH != '' }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Long Take v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.APK_PATH }}
            ${{ steps.artifacts.outputs.AAB_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Output build info
        run: |
          echo "Build completed successfully!"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Profile: ${{ github.event.inputs.profile }}"
          echo "APK: ${{ steps.artifacts.outputs.APK_PATH }}"
          echo "AAB: ${{ steps.artifacts.outputs.AAB_PATH }}"
