name: Build Android APK

# Package manager: npm, deliberately.
#
# EAS's build image ships bun 1.2.x, which cannot parse the `bun.lock`
# (lockfileVersion 2) that a current bun writes, so `bun install
# --frozen-lockfile` dies with "Unknown lockfile version". This project ships a
# package-lock.json, so npm is the installer both here and inside EAS — one
# lockfile, no version drift. Never add a `bun install` step before `eas build`:
# it leaves a dirty bun.lock that EAS uploads and then fails to parse.
#
# `cloud` builds on EAS servers; `local` builds on this runner (Klipara-style).

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: false
        default: 'preview'
        type: choice
        options:
          - production
          - preview
          - development
      build_mode:
        description: 'Where to run the build'
        required: false
        default: 'cloud'
        type: choice
        options:
          - cloud
          - local

permissions:
  contents: write

jobs:
  android:
    name: "android · ${{ github.event.inputs.profile }} · ${{ github.event.inputs.build_mode }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm)
        run: npm ci --no-audit --no-fund

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Read version from app.json
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

      # The EAS project is already linked: extra.eas.projectId in app.json is
      # the project `netlinko/long-take`. `eas init` is deliberately absent —
      # run against an already-linked project it fails, and adding the account
      # flag creates a second project under the same slug.

      - name: Accept Android SDK licenses
        if: ${{ github.event.inputs.build_mode == 'local' }}
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build on EAS servers
        if: ${{ github.event.inputs.build_mode == 'cloud' }}
        run: |
          mkdir -p build-output
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive \
            --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Fetch the cloud artifact
        if: ${{ github.event.inputs.build_mode == 'cloud' }}
        run: |
          set -euo pipefail
          EXT=apk
          [ "${{ github.event.inputs.profile }}" = "production" ] && EXT=aab
          eas build:list --platform android --limit 10 --non-interactive --json > builds.json
          node -e '
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync("builds.json", "utf8"));
            const list = Array.isArray(raw) ? raw : [raw];
            const url = b => b && b.artifacts && (b.artifacts.buildUrl || b.artifacts.applicationArchiveUrl);
            // This commit\'s build first, then any finished build as a fallback.
            const mine = list.find(b => b.gitCommitHash === process.env.GITHUB_SHA && url(b));
            const any = list.find(b => url(b));
            const pick = mine || any;
            if (!pick) {
              console.error("no build carries an artifact:", JSON.stringify(list.map(b => ({ id: b.id, status: b.status })), null, 2));
              process.exit(1);
            }
            console.log("using build", pick.id, pick.status, "commit", pick.gitCommitHash, mine ? "(this commit)" : "(fallback)");
            fs.writeFileSync("artifact-url.txt", url(pick));
          '
          curl -fL "$(cat artifact-url.txt)" \
            -o "build-output/long-take-${{ steps.version.outputs.value }}-${{ github.event.inputs.profile }}.${EXT}"
          ls -la build-output/
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build on this runner
        if: ${{ github.event.inputs.build_mode == 'local' }}
        run: |
          mkdir -p build-output
          EXT=apk
          [ "${{ github.event.inputs.profile }}" = "production" ] && EXT=aab
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile }} \
            --local \
            --non-interactive \
            --output "build-output/long-take-${{ steps.version.outputs.value }}-${{ github.event.inputs.profile }}.${EXT}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GRADLE_OPTS: "-Xmx4g"

      - name: List built artifacts
        run: ls -la build-output/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: "Long Take v${{ steps.version.outputs.value }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: build-output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
