name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development
      build_mode:
        description: 'Where to run the build'
        required: false
        default: 'local'
        type: choice
        options:
          - local
          - cloud

permissions:
  contents: write

jobs:
  android:
    name: "android"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine profile
        id: profile
        run: |
          echo "value=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"

      - name: Determine build mode
        id: build_mode
        run: |
          echo "value=${{ github.event.inputs.build_mode }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          df -h /

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install

      - name: Read version from app.json
        id: version
        run: |
          VERSION=$(cat app.json | grep '"version"' | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Initialize EAS project (if not already)
        run: |
          eas init --account netlinko --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true
          echo "Licenses accepted"

      - name: Build (android · ${{ steps.profile.outputs.value }} · ${{ steps.build_mode.outputs.value }})
        run: |
          mkdir -p build-output
          if [ "${{ steps.build_mode.outputs.value }}" = "local" ]; then
            # Local build on GitHub runner (like Klipara) - with verbose Gradle
            eas build \
              --platform android \
              --profile ${{ steps.profile.outputs.value }} \
              --local \
              --non-interactive \
              --output "build-output/long-take-android-${{ steps.profile.outputs.value }}.apk" \
              -- --stacktrace --info
          else
            # Cloud build on EAS servers
            eas build \
              --platform android \
              --profile ${{ steps.profile.outputs.value }} \
              --non-interactive \
              --wait
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GRADLE_OPTS: "-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

      - name: Download cloud artifacts (if cloud build)
        if: ${{ steps.build_mode.outputs.value == 'cloud' }}
        uses: actions/download-artifact@v4
        with:
          name: eas-build-android
          path: ./build-output

      - name: Rename cloud artifacts for consistency
        if: ${{ steps.build_mode.outputs.value == 'cloud' }}
        run: |
          ls -la build-output/
          APK_PATH=$(find build-output -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            mv "$APK_PATH" "build-output/long-take-android-${{ steps.profile.outputs.value }}.apk"
          fi
          AAB_PATH=$(find build-output -name "*.aab" | head -1)
          if [ -n "$AAB_PATH" ]; then
            mv "$AAB_PATH" "build-output/long-take-android-${{ steps.profile.outputs.value }}.aab"
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Long Take v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: build-output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output build info
        run: |
          echo "Build completed successfully!"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Profile: ${{ steps.profile.outputs.value }}"
          echo "Mode: ${{ steps.build_mode.outputs.value }}"
          ls -la build-output/
